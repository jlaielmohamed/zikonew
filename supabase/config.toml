# Supabase local/CLI configuration.
# These functions are called without a signed-in user (webhook, public captcha
# verification, or admin-only logic checked inside the function), so the
# platform-level JWT check is disabled for them.

project_id = "ziko"

[functions.create-barber-account]
verify_jwt = false

[functions.send-booking-email]
verify_jwt = false

[functions.verify-turnstile]
verify_jwt = false
